name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version read from packageManager field

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # auth via OIDC trusted publishing (configured on each package on npmjs.com).
      # needs pnpm >= 10 (OIDC support); provenance is generated automatically.
      - run: pnpm -r publish --access public --no-git-checks
